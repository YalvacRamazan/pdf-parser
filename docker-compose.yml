version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pdf_parser_ai
    restart: always
    ports:
     - "127.0.0.1:11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1

volumes:
  ollama_storage:
    